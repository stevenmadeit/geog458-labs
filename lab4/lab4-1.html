<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic21oc3RldmVuIiwiYSI6ImNtdjU0dmNjdTAyNjAyeXE1NWc1eTE1N2sifQ.McX5IfLo-cLfILbq6iwL5g';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11', 
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 11,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    map.on('load', () => {
      map.setFog({});
      map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson'
      });
      map.addLayer({
        'id': "trees-heat",
        'type': "heatmap",
        'source': "trees",
        'maxzoom': 15,
        'paint': {
          'heatmap-weight': {
            'property': "dbh",
            'type': "exponential",
            'stops': [[1, 0], [62, 1]]           
          },
            'heatmap-intensity': {
            'stops': [[11, 0.6], [15, 3]]
            },
          'heatmap-color': [
            "interpolate", ["linear"], ["heatmap-density"],
            0,    "rgba(255,255,178,0)",
            0.15, "rgb(254,217,118)",
            0.35, "rgb(253,141,60)",
            0.55, "rgb(240,59,32)",
            0.75, "rgb(189,0,38)",
            1.0,  "rgb(80,0,30)"
            ],
          'heatmap-radius': {
            'stops': [[11, 10], [15, 25]]        
          },
          'heatmap-opacity': {
            'default': 1,
            'stops': [[14, 1], [15, 0]]
          }
        }
      });
      map.addLayer({
        'id': "trees-point",
        'type': "circle",
        'source': "trees",
        'minzoom': 14,
        'paint': {
          'circle-radius': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [{ 'zoom': 15, 'value': 1 }, 5],
              [{ 'zoom': 15, 'value': 62 }, 10],
              [{ 'zoom': 22, 'value': 1 }, 20],
              [{ 'zoom': 22, 'value': 62 }, 50]
            ]
          },
          'circle-color': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [0,  "rgba(255,255,178,0)"],
              [10, "rgb(254,217,118)"],
              [20, "rgb(254,178,76)"],
              [30, "rgb(253,141,60)"],
              [40, "rgb(240,59,32)"],
              [50, "rgb(189,0,38)"],
              [60, "rgb(128,0,38)"]
            ]
          },
          'circle-stroke-color': "#333",    
          'circle-stroke-width': 1,
          'circle-opacity': {
            'stops': [[14, 0], [15, 1]]
          }
        }
      });
      map.on('click', 'trees-point', (event) => {
        new mapboxgl.Popup()
          .setLngLat(event.features[0].geometry.coordinates)
          .setHTML(`<strong>DBH:</strong> ${event.features[0].properties.dbh}`)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
